<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deal Memo Generator</title>

  <!-- PDF parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- DOCX parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

  <!-- React + ReactDOM + Babel (for in-browser JSX) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'Consolas', 'monospace'],
          },
          animation: {
            'blink': 'blink 1s step-end infinite',
          },
          keyframes: {
            blink: { '0%,100%': { opacity: 1 }, '50%': { opacity: 0 } }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Inter (weights 300–800) + JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #0a0f1e;
    }

    /* Ambient glow at the top of the page */
    body::before {
      content: '';
      position: fixed;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 1000px;
      height: 560px;
      background: radial-gradient(ellipse at center, rgba(245, 158, 11, 0.055) 0%, transparent 68%);
      pointer-events: none;
      z-index: 0;
    }

    #root { position: relative; z-index: 1; }

    /* Refined scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #0d1525; }
    ::-webkit-scrollbar-thumb { background: #243045; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #2d3d58; }

    @media print {
      .no-print { display: none !important; }
      body { background: white; color: black; }
      body::before { display: none; }
      .print-section { break-inside: avoid; }
    }

    .cursor-blink::after {
      content: '▌';
      animation: blink 1s step-end infinite;
      color: #f59e0b;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="App.jsx"></script>
</body>
</html>
